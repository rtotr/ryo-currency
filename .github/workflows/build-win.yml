name: workflows/build-win

on:
  push:
    branches:
      - dev-github-actions
    paths:
      - '**/*-win.yml'
  workflow_call:
  workflow_dispatch:

env:
  BASE_FILENAME: rtyo-win-x64
    
# test win trigger 3
jobs:
  build-win:
    name: 'Windows (MSYS2)'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          update: false
          install: git wget make base-devel pkg-config p7zip openssl
      - name: install older packages and toolchain components
        run: |
          pacman -U --noconfirm https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-gcc-libs-13.2.0-2-any.pkg.tar.zst
          pacman -U --noconfirm https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-gcc-13.2.0-2-any.pkg.tar.zst
          pacman -U --noconfirm https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-cmake-3.31.5-1-any.pkg.tar.zst
          pacman -U --noconfirm https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-boost-1.83.0-1-any.pkg.tar.zst
          pacman -S --needed --noconfirm mingw-w64-x86_64-binutils mingw-w64-x86_64-crt-git mingw-w64-x86_64-gdb mingw-w64-x86_64-gdb-multiarch mingw-w64-x86_64-headers-git mingw-w64-x86_64-libmangle-git mingw-w64-x86_64-libwinpthread-git mingw-w64-x86_64-winpthreads-git mingw-w64-x86_64-make mingw-w64-x86_64-pkgconf mingw-w64-x86_64-tools-git mingw-w64-x86_64-winstorecompat-git
          pacman -S --needed --noconfirm mingw-w64-x86_64-zeromq mingw-w64-x86_64-cppzmq mingw-w64-x86_64-libsodium mingw-w64-x86_64-hidapi mingw-w64-x86_64-protobuf mingw-w64-x86_64-libkml mingw-w64-x86_64-miniupnpc mingw-w64-x86_64-nasm
          pacman -S --needed --noconfirm mingw-w64-x86_64-openssl
          cmake --version
          gcc --version
          which openssl
          openssl version
          pkg-config --libs libcrypto
          pkg-config --libs --static libcrypto
      - name: build
        run: make release-static-win64-2005
      - name: create ${{ env.BASE_FILENAME }}.7z
        run: 7z a ${{ env.BASE_FILENAME }}.7z *
        working-directory: build/release/bin
      - uses: actions/upload-artifact@v4
        id: upload-artifact-step
        with:
          name: ${{ github.job }}   # job names must start with 'build-' for the release workflow to work correctly
          path: build/release/bin/${{ env.BASE_FILENAME }}.7z
